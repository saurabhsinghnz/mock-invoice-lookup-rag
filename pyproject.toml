[project]
name = "mock-invoice-lookup-rag"
version = "0.1.0"
description = "Offline-first guarded invoice lookup and function-calling demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "requests>=2.32,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
